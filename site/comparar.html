<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comparar versões · Palestras João Signor</title>
<style>
  :root { --bg:#16181d; --fg:#eef0f4; --muted:#a3a9b6; --line:#2c3039; --accent:#f2c94c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:none; color:var(--muted); border:0; padding:7px 14px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#16181d; font-weight:600; }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  main { display:grid; grid-auto-flow:column; grid-auto-columns:max-content; gap:20px; padding:20px; overflow-x:auto; }
  figure { margin:0; display:flex; flex-direction:column; gap:8px; }
  figcaption { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  figcaption b { font-size:15px; }
  figcaption a { color:var(--accent); font-size:13px; }
  .frame { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  iframe { display:block; border:0; transform-origin:0 0; }
</style>
</head>
<body>
<header>
  <h1>Comparar as 3 versões</h1>
  <div class="seg" role="group" aria-label="Tamanho da tela">
    <button type="button" data-w="390" aria-pressed="true">Celular</button>
    <button type="button" data-w="1440">Desktop</button>
  </div>
</header>
<main id="grid">
  <figure data-src="a-flipchart/"><figcaption><b>A · Flipchart de palestra</b><a href="a-flipchart/" target="_blank">abrir ↗</a></figcaption><div class="frame"><iframe title="Versão A" loading="lazy"></iframe></div></figure>
  <figure data-src="b-producao/"><figcaption><b>B · Quadro de produção</b><a href="b-producao/" target="_blank">abrir ↗</a></figcaption><div class="frame"><iframe title="Versão B" loading="lazy"></iframe></div></figure>
  <figure data-src="d-classico/"><figcaption><b>D · Clássico bem feito</b><a href="d-classico/" target="_blank">abrir ↗</a></figcaption><div class="frame"><iframe title="Versão D" loading="lazy"></iframe></div></figure>
</main>
<script>
  const figs = [...document.querySelectorAll('figure')];
  function layout(w) {
    const h = window.innerHeight - 120;
    // Desktop: escala para caber 3 lado a lado; celular: tamanho real
    const avail = (window.innerWidth - 80) / 3;
    const scale = w > 600 ? Math.min(1, avail / w) : 1;
    figs.forEach(f => {
      const ifr = f.querySelector('iframe');
      if (!ifr.src) ifr.src = f.dataset.src;
      ifr.style.width = w + 'px';
      ifr.style.height = (h / scale) + 'px';
      ifr.style.transform = `scale(${scale})`;
      f.querySelector('.frame').style.width = (w * scale) + 'px';
      f.querySelector('.frame').style.height = h + 'px';
    });
  }
  let cur = 390;
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    cur = +b.dataset.w; layout(cur);
  }));
  addEventListener('resize', () => layout(cur));
  layout(cur);
</script>
</body>
</html>
